<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vasco nos Pênaltis</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --night:#08122b; --navy:#0f1d44; --gold:#ffd23f; --sky:#4cc9f0; --ink:#f4f7ff;
  --red:#ff4d5e; --green:#34d27b; --orange:#ff8a1f;
  color-scheme: dark; /* jogo noturno: a cena é sempre escura, nos dois temas */
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--night)}
html,body{height:100%;margin:0;overflow:hidden}
body{
  background:var(--night);color:var(--ink);
  font-family:'Barlow Condensed','Arial Narrow','Roboto Condensed',Impact,sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent;
}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}

#hud{
  position:fixed;top:0;left:0;right:0;
  padding:calc(10px + env(safe-area-inset-top,0px)) 60px 0;
  display:flex;justify-content:center;pointer-events:none;
}
#board{
  background:rgba(6,12,30,.8);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:6px 14px;
  min-width:min(330px,100%);max-width:100%;
}
.row{display:flex;align-items:center;gap:10px;min-height:36px}
.chip{width:10px;height:22px;border-radius:3px;flex:none}
.chip.rubro{width:14px;background:repeating-linear-gradient(180deg,#d4102b 0 4px,#111 4px 8px);box-shadow:0 0 0 1px rgba(255,255,255,.5)}
.chip.vasco{width:14px;background:linear-gradient(135deg,#111 34%,#fff 34% 62%,#111 62%);box-shadow:0 0 0 1px rgba(255,255,255,.6)}
.name{font-weight:700;font-size:21px;width:58px;flex:none}
.dots{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.dot{width:17px;height:17px;border-radius:50%;border:2px solid rgba(255,255,255,.34);box-sizing:border-box;position:relative;display:block}
.dot.g{background:var(--green);border-color:var(--green)}
.dot.g::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #052414;border-width:0 2px 2px 0;transform:rotate(40deg)}
.dot.x{background:var(--red);border-color:var(--red)}
.dot.x::before,.dot.x::after{content:"";position:absolute;left:50%;top:50%;width:9px;height:2px;background:#2a0409;transform:translate(-50%,-50%) rotate(45deg)}
.dot.x::after{transform:translate(-50%,-50%) rotate(-45deg)}
.dot.now{border-color:var(--gold);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(255,210,63,.35)}}
.pts{font-weight:800;font-size:30px;width:26px;text-align:right;flex:none}
.divider{height:1px;background:rgba(255,255,255,.12)}

.fbtn{position:fixed;bottom:calc(132px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:6px;
  border:0;border-radius:14px;padding:10px 16px;font:800 21px 'Barlow Condensed','Arial Narrow',Impact,sans-serif;cursor:pointer;
  box-shadow:0 6px 18px rgba(0,0,0,.45)}
.fbtn[hidden]{display:none}
.fbtn svg{width:22px;height:22px}
#replayBtn{right:14px;background:#f4f7ff;color:#0b1736}
#cavBtn{left:14px;background:var(--gold);color:#1a1300}
.fbtn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.coinwrap{perspective:700px;margin:14px auto 6px;width:130px;height:130px}
.coin{width:130px;height:130px;position:relative;transform-style:preserve-3d}
.coin .face{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#fff6c4,#ffd23f 45%,#b98400);border:5px solid #9a6d00;box-shadow:inset 0 0 0 6px rgba(255,255,255,.25)}
.coin .face svg{width:78px;height:78px}
.coin .back{transform:rotateY(180deg)}
.coin.spin{animation:coinflip 1.7s cubic-bezier(.25,.7,.3,1) forwards}
@keyframes coinflip{0%{transform:translateY(0) rotateY(0)}45%{transform:translateY(-70px) rotateY(calc(var(--end) * .55))}100%{transform:translateY(0) rotateY(var(--end))}}
.pair{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.pair .go{margin-top:0}
#snd{
  position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));pointer-events:auto;
  width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.18);
  background:rgba(6,12,30,.8);color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0;
}
#snd:focus-visible,button.go:focus-visible{outline:3px solid #fff;outline-offset:3px}
#snd svg{width:22px;height:22px}
#snd[aria-pressed="false"] .waves{display:none}

#banner{
  position:fixed;left:0;right:0;top:30%;text-align:center;pointer-events:none;
  font-weight:800;font-size:clamp(58px,17vw,128px);line-height:.95;opacity:0;
  text-shadow:0 4px 0 rgba(0,0,0,.5),0 0 34px rgba(0,0,0,.55);padding:0 12px;
}
#banner small{display:block;font-size:.27em;font-weight:700;color:#fff;margin-top:8px;text-shadow:0 2px 6px rgba(0,0,0,.8)}
#banner.good{color:var(--gold)}
#banner.bad{color:#ff7b89}
#banner.tense{color:#fff;-webkit-text-stroke:2px #e1262d}
#banner.goldb{color:#ffd23f;-webkit-text-stroke:2px #7a5200}
#banner.tense small{-webkit-text-stroke:0;color:#fff;background:#e1262d;display:inline-block;padding:2px 12px;border-radius:8px;margin-top:12px}
#banner.show{animation:pop 2s cubic-bezier(.2,.9,.2,1) forwards}
@keyframes pop{
  0%{opacity:0;transform:scale(.45) rotate(-5deg)}
  12%{opacity:1;transform:scale(1.14) rotate(1.5deg)}
  22%{transform:scale(1) rotate(0)}
  80%{opacity:1}
  100%{opacity:0;transform:scale(1.06)}
}

#prompt{
  position:fixed;left:0;right:0;bottom:0;
  padding:0 16px calc(16px + env(safe-area-inset-bottom,0px));
  text-align:center;pointer-events:none;
}
#prompt b{display:block;font-size:32px;font-weight:800;text-shadow:0 2px 10px rgba(0,0,0,.8)}
#prompt span{display:block;font-size:19px;font-weight:600;max-width:420px;margin:0 auto;opacity:.92;text-shadow:0 2px 8px rgba(0,0,0,.85)}

#power{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(112px + env(safe-area-inset-bottom,0px));
  width:min(220px,60vw);height:10px;border-radius:6px;background:rgba(255,255,255,.16);
  overflow:hidden;opacity:0;transition:opacity .15s;pointer-events:none;
}
#power.on{opacity:1}
#power i{display:block;height:100%;background:linear-gradient(90deg,#34d27b,#ffd23f 60%,#ff4d5e);clip-path:inset(0 100% 0 0)}

#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
#overlay{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(4,8,22,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:20px;
}
#overlay[hidden]{display:none}
.card{
  max-width:430px;width:100%;background:linear-gradient(180deg,#15296a,#0b1736);
  border:1px solid rgba(255,255,255,.16);border-radius:20px;padding:26px 22px 22px;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.55);
}
.card h1{margin:0 0 4px;font-size:54px;line-height:.92;font-weight:800;color:var(--gold)}
.card h1.lose{color:#ff7b89}
.card p{margin:8px 0;font-size:21px;line-height:1.15;font-weight:500}
.how{display:grid;gap:10px;margin:16px 0 14px;text-align:left}
.how div{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;background:rgba(255,255,255,.07);border-radius:12px;padding:10px 12px;font-size:19px;line-height:1.12}
.how svg{width:40px;height:40px}
.age{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:50%;background:#d4102b;color:#fff;font-weight:800;font-size:30px;border:3px solid #fff;margin-bottom:8px}
.age.small{width:42px;height:42px;font-size:19px;border-width:2px;margin-bottom:2px}
.card p.warn{color:#ff9aa5;font-weight:700}
.modes{display:grid;gap:10px;margin:12px 0 4px}
button.mode{cursor:pointer;border:0;border-radius:14px;background:var(--gold);color:#1a1300;text-align:left;padding:12px 16px;font-family:inherit;display:grid;gap:2px}
button.mode b{font-size:28px;font-weight:800;line-height:1}
button.mode span{font-size:17px;font-weight:600;line-height:1.1}
button.mode.falta{background:linear-gradient(135deg,#ffffff,#d9dde8);}
button.mode.gk{background:linear-gradient(135deg,#7df0b0,#27b765);}
button.mode.lvl{padding:9px 16px}button.mode.lvl b{font-size:24px}
button.mode.l1{background:#9be7b4}button.mode.l2{background:#c8eb7d}button.mode.l3{background:#ffd23f}button.mode.l4{background:#ff9a3c}button.mode.l5{background:#ff5d6e;color:#2a0006}
button.mode.gold{background:linear-gradient(135deg,#fff3b0,#ffd23f 45%,#d99a00);box-shadow:0 0 0 2px #fff6 inset}
button.mode:focus-visible{outline:3px solid #fff;outline-offset:3px}
button.mode:active{transform:translateY(1px)}
button.go.alt{background:transparent;color:var(--ink);border:2px solid rgba(255,255,255,.4);font-size:22px;padding:8px 22px}
.final{font-size:46px;font-weight:800;margin:8px 0 2px}
.finaldots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0}
button.go{
  cursor:pointer;border:0;border-radius:14px;background:var(--gold);color:#1a1300;
  font:800 28px 'Barlow Condensed','Arial Narrow',Impact,sans-serif;padding:12px 34px;margin-top:8px;
}
button.go:active{transform:translateY(1px)}
@media (prefers-reduced-motion:reduce){
  #banner.show{animation:fade 2s forwards}
  @keyframes fade{0%{opacity:0}10%{opacity:1}80%{opacity:1}100%{opacity:0}}
  .dot.now{animation:none;box-shadow:0 0 0 3px rgba(255,210,63,.4)}
}
</style>
</head>
<body>
<canvas id="c" aria-label="Campo de pênaltis. Arraste para chutar ou para pular."></canvas>

<header id="hud">
  <div id="board" aria-live="polite">
    <div class="row"><span class="chip vasco"></span><span class="name">Vasco</span><span class="dots" id="dotsYou"></span><span class="pts" id="ptsYou">0</span></div>
    <div class="divider"></div>
    <div class="row"><span class="chip rubro"></span><span class="name">Rival</span><span class="dots" id="dotsCpu"></span><span class="pts" id="ptsCpu">0</span></div>
  </div>
</header>
<button id="snd" aria-pressed="true" aria-label="Ligar ou desligar o som">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><g class="waves"><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></g></svg>
</button>

<button id="replayBtn" class="fbtn" hidden aria-label="Ver replay do lance"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>Replay</button>
<button id="cavBtn" class="fbtn" hidden aria-label="Bater de cavadinha"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="6" cy="18" r="3" fill="currentColor" stroke="none"/><path d="M8 15 C 11 4, 17 4, 20 12"/></svg>Cavadinha</button>
<div id="flash"></div>
<div id="banner"></div>
<div id="power" aria-hidden="true"><i></i></div>
<footer id="prompt"><b id="pTitle"></b><span id="pSub"></span></footer>
<section id="overlay"></section>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');

/* ---------- constantes do mundo (metros) e da câmera ---------- */
const VW = 480, VH = 760;                       // cena virtual
let F = 560;
const CAMH = 1.7, HY = 290, CX = VW / 2;
const CAM = { x: 0, z: 14.2, fx: 0, fz: -1, rx: 1, rz: 0 };
let spot = { X: 0, Z: 11 };
const GOAL_W = 7.32, GOAL_H = 2.44, HW = GOAL_W / 2, SPOT_Z = 11, BALL_R = 0.19;
const BOARD_TOP = 316, BOARD_BOT = 345;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const proj = (X, Y, Z) => {
  const dx = X - CAM.x, dz = Z - CAM.z, depth = Math.max(.05, dx * CAM.fx + dz * CAM.fz), lat = dx * CAM.rx + dz * CAM.rz, k = F / depth;
  return { x: CX + lat * k, y: HY - (Y - CAMH) * k, k };
};
const gy = Z => HY + CAMH * F / Math.max(.3, CAM.z - Z);
function setSpot(X, Z, back) {           // câmera atrás da bola, olhando para o centro do gol
  spot = { X, Z }; const L = Math.hypot(X, Z), dX = X / L, dZ = Z / L;
  CAM.x = X + dX * back; CAM.z = Z + dZ * back; CAM.fx = -dX; CAM.fz = -dZ; CAM.rx = dZ; CAM.rz = -dX;
  F = 560 * (L + back) / 14.2;
}
const isFalta = () => mode === 'falta1' || mode === 'falta2';
function pathAt(sh, u) {
  const b = (sh.curve || 0) * 4 * u * (1 - u);
  return { X: lerp(spot.X, sh.X, u) + b * CAM.rx, Y: lerp(BALL_R, sh.Y, u) + sh.arc * 4 * u * (1 - u), Z: lerp(spot.Z, 0, u) + b * CAM.rz };
}
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function gauss() { let u = 0; for (let i = 0; i < 4; i++) u += Math.random(); return clamp((u - 2) / 0.577, -1.8, 1.8); }
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- tela ---------- */
let W = 0, H = 0, DPR = 1, S = 1, OX = 0, OY = 0, xmin = 0, xmax = VW, ymin = 0;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  S = Math.min(W / VW, H / VH);
  OX = (W - VW * S) / 2; OY = H - VH * S;       // cena alinhada embaixo, arquibancada cresce pra cima
  xmin = -OX / S; xmax = (W - OX) / S; ymin = -OY / S;
  buildCrowd();
}

/* ---------- torcida (fica atrás do gol) ---------- */
let crowd = [], flags = [];
const SKIN = ['#f1c8a0', '#c68a5e', '#8d5a3b', '#e0ac82', '#5a3a26'];
const YOU_COL = ['#ffffff', '#ffffff', '#f2f2f2', '#1b1b1b', '#1b1b1b', '#d6d6d6'];
const CPU_COL = ['#d4102b', '#d4102b', '#e8213a', '#111111', '#d4102b'];
const NEU_COL = ['#d9dde8', '#8a93a8', '#e85d75', '#6b7390'];
function buildCrowd() {
  const r = mulberry(20260);
  crowd = []; flags = [];
  const top = ymin - 10, rowH = 15, colW = 12.5;
  const rows = Math.ceil((BOARD_TOP - 8 - top) / rowH);
  const cols = Math.ceil((xmax - xmin) / colW) + 2;
  for (let ri = rows - 1; ri >= 0; ri--) {
    const rowFrac = ri / rows;
    const y = BOARD_TOP - 6 - ri * rowH;
    for (let ci = 0; ci < cols; ci++) {
      const x = xmin - 6 + ci * colW + (ri % 2 ? colW / 2 : 0) + (r() - .5) * 3;
      const f = (x - xmin) / (xmax - xmin);
      const pYou = clamp(1.1 - f * 1.2, 0.08, 0.92);
      let team = r() < pYou ? 'you' : 'cpu', pal = team === 'you' ? YOU_COL : CPU_COL;
      if (r() < 0.1) { team = 'neu'; pal = NEU_COL; }
      crowd.push({ x, y, sz: 1 - 0.38 * rowFrac, team, col: pal[(r() * pal.length) | 0], skin: SKIN[(r() * SKIN.length) | 0], ph: r() * 6.28, sp: 3 + r() * 3, arm: r() < 0.6 });
    }
  }
  const nf = Math.max(6, Math.round((xmax - xmin) / 60));
  for (let i = 0; i < nf; i++) {
    const x = xmin + r() * (xmax - xmin), f = (x - xmin) / (xmax - xmin);
    const you = r() < clamp(1.1 - f * 1.2, 0.08, 0.92);
    flags.push({ x, y: ymin + 70 + r() * (BOARD_TOP - ymin - 110), a: you ? '#151515' : '#d4102b', b: you ? '#ffffff' : '#111111', ph: r() * 6, team: you ? 'you' : 'cpu' });
  }
}

/* ---------- estado do jogo ---------- */
let clock = 0, phase = 'menu', turn = 'you', ended = false, winner = null;
const marks = { you: [], cpu: [] };
const exc = { you: 0, cpu: 0 };
let tension = .5, tremor = false, beatT = 0, beatPulse = 0, shakeAmp = 0, shx = 0, shy = 0, zoom = 1, zoomTarget = 1, slowmo = 1, kickNo = 0;
const NUMS = [10, 9, 7, 11, 8, 5, 4, 3, 2, 6, 14, 1];
const pick = a => a[(Math.random() * a.length) | 0];
let KP = null, mode = 'classic', lastMiss = 10, first = 'you', rec = null, replaying = null, chaos = null;
let ball, shot = null, K, leg = null, net = null, afterT = 0, waitT = 0, pendingShot = null, drag = null, confetti = [];
const BALL0 = () => ({ X: spot.X, Y: BALL_R, Z: spot.Z, vx: 0, vy: 0, vz: 0, spin: 0, visible: true });
ball = BALL0();
K = { owner: 'cpu', dive: false, start: 0, dur: .3, tx: 0, ty: 1 };

/* ---------- som (WebAudio, sem arquivos) ---------- */
const AUD = { ctx: null, master: null, noise: null, crowdGain: null, on: true, lastCrowd: 0 };
function initAudio() {
  if (AUD.ctx) { if (AUD.ctx.state === 'suspended') AUD.ctx.resume(); return; }
  try {
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    const c = new C(); AUD.ctx = c;
    AUD.master = c.createGain(); AUD.master.gain.value = AUD.on ? 0.7 : 0; AUD.master.connect(c.destination);
    const len = c.sampleRate * 2, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    AUD.noise = buf;
    const src = c.createBufferSource(); src.buffer = buf; src.loop = true;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 520; bp.Q.value = 0.6;
    const g = c.createGain(); g.gain.value = 0.05;
    src.connect(bp); bp.connect(g); g.connect(AUD.master); src.start(); AUD.crowdGain = g;
  } catch (e) { /* sem áudio, segue o jogo */ }
}
function tone(f0, dur, type, vol, f1) {
  const c = AUD.ctx; if (!c || !AUD.on) return;
  const o = c.createOscillator(), g = c.createGain(), t = c.currentTime;
  o.type = type; o.frequency.setValueAtTime(f0, t); if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(AUD.master); o.start(t); o.stop(t + dur + 0.05);
}
function noiseBurst(dur, f0, f1, q, vol, attack) {
  const c = AUD.ctx; if (!c || !AUD.on) return;
  const s = c.createBufferSource(); s.buffer = AUD.noise; s.loop = true;
  const f = c.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = q;
  const t = c.currentTime;
  f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = c.createGain(); g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(AUD.master); s.start(t); s.stop(t + dur + 0.05);
}
const sfx = {
  kick(p) { tone(170, .14, 'sine', .5 + .4 * p, 55); noiseBurst(.06, 1800, 900, 1, .35, .004); },
  whistle() {
    const c = AUD.ctx; if (!c || !AUD.on) return;
    const t = c.currentTime, o = c.createOscillator(), l = c.createOscillator(), lg = c.createGain(), g = c.createGain();
    o.type = 'sine'; o.frequency.value = 2900; l.frequency.value = 34; lg.gain.value = 150;
    l.connect(lg); lg.connect(o.frequency);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(.16, t + .03); g.gain.setValueAtTime(.16, t + .38); g.gain.exponentialRampToValueAtTime(0.0001, t + .48);

    low.forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(i * bw, H * .68, bw + 1, H * .08); });
    ctx.fillStyle = '#0b0b0b'; ctx.fillRect(0, H * .76, W, H * .24);
    for (let k = 0; k < 500; k++) { const g = Math.random() * 255 | 0; ctx.fillStyle = 'rgba(' + g + ',' + g + ',' + g + ',.35)'; ctx.fillRect(Math.random() * W, Math.random() * H, 2 + Math.random() * 3, 1 + Math.random() * 2); }
  }
}

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  update(dt); draw(); requestAnimationFrame(frame);
}
window.addEventListener('resize', resize);
resize(); showMenu(); updateScoreboard();
requestAnimationFrame(frame);
})();
</script>
</body>
