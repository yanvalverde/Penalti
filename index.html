<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gigante da Colina</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#08122b; --navy:#0f1d44; --gold:#ffd23f; --sky:#4cc9f0; --ink:#f4f7ff;
  --red:#ff4d5e; --green:#34d27b; --orange:#ff8a1f;
  color-scheme: dark; /* jogo noturno: a cena é sempre escura, nos dois temas */
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--night)}
html,body{height:100%;margin:0;overflow:hidden}
body{
  background:var(--night);color:var(--ink);
  font-family:'Barlow Condensed','Arial Narrow','Roboto Condensed',Impact,sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent;
}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c:active{cursor:grabbing}

#hud{
  position:fixed;top:0;left:0;right:0;
  padding:calc(10px + env(safe-area-inset-top,0px)) 60px 0;
  display:flex;justify-content:center;pointer-events:none;
}
#board{
  background:rgba(6,12,30,.8);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:6px 14px;
  min-width:min(330px,100%);max-width:100%;
}
.row{display:flex;align-items:center;gap:10px;min-height:36px}
.chip{width:10px;height:22px;border-radius:3px;flex:none}
.chip.rubro{width:14px;background:repeating-linear-gradient(180deg,#d4102b 0 4px,#111 4px 8px);box-shadow:0 0 0 1px rgba(255,255,255,.5)}
.chip.vasco{width:14px;background:linear-gradient(135deg,#111 34%,#fff 34% 62%,#111 62%);box-shadow:0 0 0 1px rgba(255,255,255,.6)}
.name{font-weight:700;font-size:21px;width:58px;flex:none}
.dots{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.dot{width:17px;height:17px;border-radius:50%;border:2px solid rgba(255,255,255,.34);box-sizing:border-box;position:relative;display:block}
.dot.g{background:var(--green);border-color:var(--green)}
.dot.g::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #052414;border-width:0 2px 2px 0;transform:rotate(40deg)}
.dot.x{background:var(--red);border-color:var(--red)}
.dot.x::before,.dot.x::after{content:"";position:absolute;left:50%;top:50%;width:9px;height:2px;background:#2a0409;transform:translate(-50%,-50%) rotate(45deg)}
.dot.x::after{transform:translate(-50%,-50%) rotate(-45deg)}
.dot.now{border-color:var(--gold);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px rgba(255,210,63,.35)}}
.pts{font-weight:800;font-size:30px;width:26px;text-align:right;flex:none}
.divider{height:1px;background:rgba(255,255,255,.12)}

.fbtn{position:fixed;bottom:calc(132px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:6px;
  border:0;border-radius:14px;padding:10px 16px;font:800 21px 'Barlow Condensed','Arial Narrow',Impact,sans-serif;cursor:pointer;
  box-shadow:0 6px 18px rgba(0,0,0,.45)}
.fbtn[hidden]{display:none}
.fbtn svg{width:22px;height:22px}
#replayBtn{right:14px;background:#f4f7ff;color:#0b1736}
#cavBtn{display:none!important}
#slate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.92);opacity:0;pointer-events:none;transition:opacity .4s;padding:24px;z-index:1}
#slate.on{opacity:1}
#slate div{border-top:4px solid var(--gold);border-bottom:4px solid var(--gold);padding:18px 8px;text-align:center;max-width:420px}
#slate small{display:block;font-size:16px;letter-spacing:.3em;color:var(--gold);font-weight:800;margin-bottom:8px}
#slate b{font-size:32px;line-height:1.1;font-weight:800;color:#fff}
#skipIntro{z-index:2;bottom:calc(22px + env(safe-area-inset-bottom,0px));right:14px;background:#f4f7ff;color:#0b1736}
.startbtn{font-size:30px!important;padding:14px 30px!important}
#skipBtn{z-index:2;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#f4f7ff;color:#0b1736}
.fbtn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.coinwrap{perspective:700px;margin:14px auto 6px;width:130px;height:130px}
.coin{width:130px;height:130px;position:relative;transform-style:preserve-3d}
.coin .face{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#fff6c4,#ffd23f 45%,#b98400);border:5px solid #9a6d00;box-shadow:inset 0 0 0 6px rgba(255,255,255,.25)}
.coin .face svg{width:78px;height:78px}
.coin .back{transform:rotateY(180deg)}
.coin.spin{animation:coinflip 1.7s cubic-bezier(.25,.7,.3,1) forwards}
@keyframes coinflip{0%{transform:translateY(0) rotateY(0)}45%{transform:translateY(-70px) rotateY(calc(var(--end) * .55))}100%{transform:translateY(0) rotateY(var(--end))}}
.pair{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.pair .go{margin-top:0}
#snd{
  position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));pointer-events:auto;
  width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.18);
  background:rgba(6,12,30,.8);color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0;
}
#snd:focus-visible,button.go:focus-visible{outline:3px solid #fff;outline-offset:3px}
#snd svg{width:22px;height:22px}
#snd[aria-pressed="false"] .waves{display:none}
#pauseBtn{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.18);
  background:rgba(6,12,30,.8);color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0;z-index:2}
#pauseBtn[hidden],#camBtn[hidden],#shotBar[hidden]{display:none}
#camBtn{position:fixed;left:12px;top:calc(60px + env(safe-area-inset-top,0px));width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.18);
  background:rgba(6,12,30,.8);color:var(--ink);cursor:pointer;display:grid;place-items:center;padding:0;z-index:2}
#camBtn svg{width:22px;height:22px}
#shotBar{position:fixed;left:0;right:0;top:calc(108px + env(safe-area-inset-top,0px));display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:0 10px;z-index:2}
#shotBar button{cursor:pointer;border:1.5px solid rgba(255,255,255,.25);background:rgba(6,12,30,.82);color:#e3e9f6;border-radius:999px;padding:6px 12px;
  font:800 17px 'Barlow Condensed','Arial Narrow',Impact,sans-serif;display:flex;align-items:center;gap:5px}
#shotBar button svg{width:18px;height:18px}
#shotBar button.on{background:var(--gold);color:#1a1300;border-color:var(--gold)}
#shotBar button.cav{background:#fff;color:#111;border-color:#fff}
#camBtn:focus-visible,#shotBar button:focus-visible{outline:3px solid #fff;outline-offset:2px}
#toast{position:fixed;left:50%;top:calc(160px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:rgba(0,0,0,.78);color:#fff;
  font:700 18px 'Barlow Condensed','Arial Narrow',sans-serif;padding:6px 14px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg3 button{cursor:pointer;border:2px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#c3cde3;border-radius:11px;padding:7px 2px;font:700 17px 'Barlow Condensed','Arial Narrow',sans-serif;white-space:nowrap}
.filebtn{cursor:pointer;display:block;border:2px dashed rgba(255,210,63,.6);background:rgba(255,210,63,.1);color:#fff;border-radius:11px;padding:8px 6px;font:700 17px 'Barlow Condensed','Arial Narrow',sans-serif;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg3[style] {grid-template-columns:1fr auto auto!important}
.seg3 button.on{border-color:var(--gold);color:#1a1300;background:var(--gold)}#pauseBtn svg{width:22px;height:22px}#pauseBtn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.pmenu{display:grid;gap:10px;margin-top:14px}
.pmenu button{cursor:pointer;border:0;border-radius:14px;padding:13px 16px;font:800 26px 'Barlow Condensed','Arial Narrow',Impact,sans-serif;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.1);color:#fff}
.pmenu button svg{width:26px;height:26px;flex:none}
.pmenu button.main{background:var(--gold);color:#1a1300}
.pmenu button.exit{background:rgba(255,77,94,.16);color:#ff9aa5}
.pmenu button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.setting{display:grid;gap:6px;text-align:left;background:rgba(255,255,255,.07);border-radius:14px;padding:12px 14px}
.setting label{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800}
.setting label svg{width:24px;height:24px;flex:none}
.setting label output{margin-left:auto;font-size:19px;color:#c3cde3;font-weight:700}
.setting input[type=range]{width:100%;accent-color:#ffd23f;height:28px}
.toggle{display:flex;align-items:center;justify-content:space-between;font-size:22px;font-weight:800;background:rgba(255,255,255,.07);border-radius:14px;padding:12px 14px;cursor:pointer;border:0;color:#fff;font-family:inherit;width:100%}
.toggle i{width:52px;height:30px;border-radius:999px;background:rgba(255,255,255,.25);position:relative;flex:none;transition:background .15s}
.toggle i::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.toggle[aria-pressed="true"] i{background:#34d27b}.toggle[aria-pressed="true"] i::after{left:25px}
.toggle span{display:flex;align-items:center;gap:10px}.toggle svg{width:24px;height:24px}

#banner{
  position:fixed;left:0;right:0;top:30%;text-align:center;pointer-events:none;
  font-weight:800;font-size:clamp(58px,17vw,128px);line-height:.95;opacity:0;
  text-shadow:0 4px 0 rgba(0,0,0,.5),0 0 34px rgba(0,0,0,.55);padding:0 12px;
}
#banner small{display:block;font-size:.27em;font-weight:700;color:#fff;margin-top:8px;text-shadow:0 2px 6px rgba(0,0,0,.8)}
#banner.good{color:var(--gold)}
#banner.bad{color:#ff7b89}
#banner.tense{color:#fff;-webkit-text-stroke:2px #e1262d}
#banner.goldb{color:#ffd23f;-webkit-text-stroke:2px #7a5200}
#banner.tense small{-webkit-text-stroke:0;color:#fff;background:#e1262d;display:inline-block;padding:2px 12px;border-radius:8px;margin-top:12px}
#banner.show{animation:pop 2s cubic-bezier(.2,.9,.2,1) forwards}
@keyframes pop{
  0%{opacity:0;transform:scale(.45) rotate(-5deg)}
  12%{opacity:1;transform:scale(1.14) rotate(1.5deg)}
  22%{transform:scale(1) rotate(0)}
  80%{opacity:1}
  100%{opacity:0;transform:scale(1.06)}
}

#prompt{
  position:fixed;left:0;right:0;bottom:0;
  padding:0 16px calc(16px + env(safe-area-inset-bottom,0px));
  text-align:center;pointer-events:none;
}
#prompt b{display:block;font-size:32px;font-weight:800;text-shadow:0 2px 10px rgba(0,0,0,.8)}
#prompt span{display:block;font-size:19px;font-weight:600;max-width:420px;margin:0 auto;opacity:.92;text-shadow:0 2px 8px rgba(0,0,0,.85)}

#power{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(112px + env(safe-area-inset-bottom,0px));
  width:min(220px,60vw);height:10px;border-radius:6px;background:rgba(255,255,255,.16);
  overflow:hidden;opacity:0;transition:opacity .15s;pointer-events:none;
}
#power.on{opacity:1}
#power i{display:block;height:100%;background:linear-gradient(90deg,#34d27b,#ffd23f 60%,#ff4d5e);clip-path:inset(0 100% 0 0)}

#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none}
#overlay{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(4,8,22,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:20px;
}
#overlay[hidden]{display:none}
#overlay{overflow:auto;align-items:safe center}
.opt .tro{width:44px;height:44px;flex:none;display:grid;place-items:center}.opt .tro svg{width:40px;height:40px}
.opt.locked{opacity:.5;cursor:not-allowed}.opt.locked .tro{filter:grayscale(1)}.opt.locked i{background:rgba(255,255,255,.2);color:#fff}
.tro.big svg{width:70px;height:70px}.tro.huge svg{width:120px;height:120px;filter:drop-shadow(0 0 20px rgba(255,210,63,.7))}
.card .tro{display:flex;justify-content:center}
.bracket{display:grid;gap:6px;margin:12px 0 14px;text-align:left}
.br{display:grid;grid-template-columns:1fr auto;grid-template-areas:"rd st" "vs st";gap:0 8px;background:rgba(255,255,255,.07);border-radius:12px;padding:8px 12px;border:2px solid transparent}
.br .rd{grid-area:rd;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:#9fb0cf;font-weight:700}
.br .vs{grid-area:vs;font-size:22px;font-weight:800;display:flex;align-items:center;gap:8px}.br .vs .chip{display:inline-block;width:14px;height:22px;border-radius:3px}
.br .st{grid-area:st;align-self:center;font-size:17px;font-weight:800;color:#c3cde3}
.br.now{border-color:var(--gold);background:rgba(255,210,63,.12)}.br.now .st{color:var(--gold)}
.br.done{opacity:.65}.br.done .st{color:#34d27b}
.card.champ h1{font-size:64px}.card .cn{font-size:24px;font-weight:800;margin:0}.card .unl{background:rgba(52,210,123,.15);border-radius:10px;padding:8px}
#overlay.menuov{background:linear-gradient(180deg,rgba(4,8,22,.15),rgba(4,8,22,.55) 45%,rgba(4,8,22,.85));backdrop-filter:none;-webkit-backdrop-filter:none;align-items:safe center;overflow:auto;padding:16px}
.menu{width:100%;max-width:440px;margin:0 auto;display:grid;gap:12px;padding-bottom:env(safe-area-inset-bottom,0px)}
.logo{position:relative;text-align:center;margin:4px 0 2px;padding:10px 0 4px}
.logo .sash{position:absolute;left:50%;top:50%;width:140%;height:30px;background:#fff;transform:translate(-50%,-50%) rotate(-14deg);box-shadow:0 0 0 7px #111;opacity:.95;z-index:0}
.logo h1{position:relative;z-index:1;margin:0;display:grid;line-height:.84;font-weight:800;text-transform:uppercase;color:#fff;font-size:clamp(50px,15vw,74px);
  text-shadow:3px 3px 0 #111,-2px -2px 0 #111,2px -2px 0 #111,-2px 2px 0 #111,0 8px 24px rgba(0,0,0,.7)}
.logo h1 .da{font-size:.42em;letter-spacing:.3em;margin:4px 0 2px;color:#111;text-shadow:none;background:#fff;justify-self:center;padding:2px 6px 0 14px;border-radius:4px}
.logo .kick{position:relative;z-index:1;display:inline-block;margin-top:8px;font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:#111;border:1px solid rgba(255,255,255,.35);padding:3px 10px;border-radius:999px}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cat{cursor:pointer;border:2px solid rgba(255,255,255,.18);background:rgba(8,14,32,.78);color:#cfd7ea;border-radius:16px;padding:12px 6px 10px;display:grid;justify-items:center;gap:4px;font-family:inherit;transition:transform .12s}
.cat svg{width:36px;height:36px}
.cat b{font-size:19px;font-weight:800;line-height:1}
.cat.on{background:#fff;color:#0b0b0b;border-color:#fff;transform:translateY(-3px);box-shadow:0 8px 22px rgba(0,0,0,.45),inset 0 -5px 0 #111}
.panel{background:rgba(8,14,32,.82);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:10px;display:grid;gap:8px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.opt{cursor:pointer;display:flex;align-items:center;gap:10px;text-align:left;border:0;border-radius:13px;background:rgba(255,255,255,.08);color:#fff;padding:12px 14px;font-family:inherit}
.opt span{flex:1;display:grid;gap:2px}.opt b{font-size:26px;font-weight:800;line-height:1}.opt small{font-size:16px;font-weight:600;color:#c3cde3;line-height:1.1}
.opt i{width:36px;height:36px;border-radius:50%;background:var(--gold);color:#1a1300;display:grid;place-items:center;flex:none}.opt i svg{width:20px;height:20px}
.opt:active{transform:translateY(1px)}
.sect{font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#9fb0cf;padding:2px 4px 0}
.stars{display:flex;gap:6px;justify-content:center}
.star{cursor:pointer;border:0;background:none;color:rgba(255,255,255,.22);padding:2px}.star svg{width:44px;height:44px}.star.on{color:var(--gold)}
.lvlname{text-align:center;font-size:17px;color:#c3cde3}.lvlname b{color:#fff;font-size:21px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{cursor:pointer;border:2px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#c3cde3;border-radius:13px;padding:8px;font:700 17px 'Barlow Condensed','Arial Narrow',sans-serif;display:grid;justify-items:center;gap:4px}
.seg svg{width:60px;height:36px}.seg button.on{border-color:var(--gold);color:#fff;background:rgba(255,210,63,.14)}
.play{cursor:pointer;border:0;border-radius:14px;background:var(--gold);color:#1a1300;font:800 28px 'Barlow Condensed','Arial Narrow',Impact,sans-serif;padding:11px;display:flex;justify-content:center;align-items:center;gap:6px}.play svg{width:24px;height:24px}
.wx{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.wx button{cursor:pointer;border:1.5px solid rgba(255,255,255,.16);background:rgba(8,14,32,.78);color:#c3cde3;border-radius:12px;padding:7px 2px;font:700 16px 'Barlow Condensed','Arial Narrow',sans-serif;display:grid;justify-items:center;gap:2px}
.wx svg{width:24px;height:24px}.wx button.on{background:#fff;color:#111;border-color:#fff}
.help{cursor:pointer;justify-self:center;border:0;background:none;color:#dfe6f5;font:700 18px 'Barlow Condensed','Arial Narrow',sans-serif;text-decoration:underline;text-underline-offset:3px;padding:4px 10px}
.cat:focus-visible,.opt:focus-visible,.star:focus-visible,.seg button:focus-visible,.wx button:focus-visible,.play:focus-visible,.help:focus-visible{outline:3px solid #fff;outline-offset:2px}
.card{
  max-width:430px;width:100%;background:linear-gradient(180deg,#15296a,#0b1736);
  border:1px solid rgba(255,255,255,.16);border-radius:20px;padding:26px 22px 22px;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.55);
}
.card h1{margin:0 0 4px;font-size:54px;line-height:.92;font-weight:800;color:var(--gold)}
.card h1.lose{color:#ff7b89}
.card p{margin:8px 0;font-size:21px;line-height:1.15;font-weight:500}
.how{display:grid;gap:10px;margin:16px 0 14px;text-align:left}
.how div{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;background:rgba(255,255,255,.07);border-radius:12px;padding:10px 12px;font-size:19px;line-height:1.12}
.how svg{width:40px;height:40px}
.age{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:50%;background:#d4102b;color:#fff;font-weight:800;font-size:30px;border:3px solid #fff;margin-bottom:8px}
.age.small{width:42px;height:42px;font-size:19px;border-width:2px;margin-bottom:2px}
.card p.warn{color:#ff9aa5;font-weight:700}
.modes{display:grid;gap:10px;margin:12px 0 4px}
button.mode{cursor:pointer;border:0;border-radius:14px;background:var(--gold);color:#1a1300;text-align:left;padding:12px 16px;font-family:inherit;display:grid;gap:2px}
button.mode b{font-size:28px;font-weight:800;line-height:1}
button.mode span{font-size:17px;font-weight:600;line-height:1.1}
button.mode.falta{background:linear-gradient(135deg,#ffffff,#d9dde8);}
button.mode.gk{background:linear-gradient(135deg,#7df0b0,#27b765);}
button.mode.lvl{padding:9px 16px}button.mode.lvl b{font-size:24px}
button.mode.l1{background:#9be7b4}button.mode.l2{background:#c8eb7d}button.mode.l3{background:#ffd23f}button.mode.l4{background:#ff9a3c}button.mode.l5{background:#ff5d6e;color:#2a0006}
button.mode.gold{background:linear-gradient(135deg,#fff3b0,#ffd23f 45%,#d99a00);box-shadow:0 0 0 2px #fff6 inset}
button.mode:focus-visible{outline:3px solid #fff;outline-offset:3px}
button.mode:active{transform:translateY(1px)}
button.go.alt{background:transparent;color:var(--ink);border:2px solid rgba(255,255,255,.4);font-size:22px;padding:8px 22px}
.final{font-size:46px;font-weight:800;margin:8px 0 2px}

const TUNE_VASCO = { bpm: 150, vol: .9, bass: [48,48,53,55, 53,48], mel: [
  [67,.5],[72,1],[72,.5],[74,.5],[76,1],[0,.5], [79,1],[79,.5],[77,.5],[76,1],[72,1], [77,.5],[77,.5],[77,.5],[81,1],[79,.5],[77,1], [74,1],[76,.5],[77,.5],[79,1],[67,1],
  [84,1],[83,.5],[81,.5],[79,1],[76,1], [72,4]] };
const TUNE_RIVAL = { bpm: 96, vol: .6, bass: [45,45,50,52, 45,50,52,45], mel: [
  [69,1],[72,1],[76,2], [74,1],[72,1],[71,2], [69,1],[71,1],[72,1],[74,1], [76,4], [77,1],[76,1],[74,2], [72,1],[71,1],[69,2], [71,2],[68,2], [69,4]] };
const tuneLen = T => T.bass.length * 4 * 60 / T.bpm;
function playTune(T) {
  const c = AUD.ctx; if (!c) return null;
  const bus = c.createGain(); bus.gain.value = AUD.on ? T.vol * PREF.music / 80 : 0; bus.connect(AUD.master);
  const t0 = c.currentTime + .2, B = 60 / T.bpm;
  const brassF = c.createBiquadFilter(); brassF.type = 'lowpass'; brassF.frequency.value = 2200; brassF.Q.value = 1.2; brassF.connect(bus);
  const ch1 = c.createBiquadFilter(); ch1.type = 'bandpass'; ch1.frequency.value = 600; ch1.Q.value = 1.8; ch1.connect(bus);
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  const note = (m, t, d, dest, type, vol, n, det) => {
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + .03);
    g.gain.setValueAtTime(vol * .85, t + d * .8); g.gain.exponentialRampToValueAtTime(0.0001, t + d); g.connect(dest);
    for (let i = 0; i < n; i++) { const o = c.createOscillator(); o.type = type; o.frequency.value = hz(m) * (1 + (i - (n - 1) / 2) * det); o.connect(g); o.start(t); o.stop(t + d + .05); }
  };
  const hit = (at, freq, q, d, v, type) => { const s2 = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s2.buffer = AUD.noise; f.type = type || 'bandpass'; f.frequency.value = freq; f.Q.value = q;
    g.gain.setValueAtTime(v, at); g.gain.exponentialRampToValueAtTime(0.0001, at + d); s2.connect(f); f.connect(g); g.connect(bus); s2.start(at, Math.random()); s2.stop(at + d + .02); };
  let bt = 0;
  for (const [m, d] of T.mel) {
    if (m) { const t = t0 + bt * B, dur = d * B * .95; note(m, t, dur, brassF, 'sawtooth', .06, 3, .006); note(m - 12, t, dur, ch1, 'sawtooth', .05, 4, .012); }
    bt += d;
  }
  T.bass.forEach((r, bar) => {
    const t = t0 + bar * 4 * B;
    for (let k = 0; k < 4; k++) note(r - 12 + (k % 2 ? 7 : 0), t + k * B, B * .85, bus, 'triangle', .16, 1, 0);
    for (const k of [.5, 1.5, 2.5, 3.5]) note(r + 12, t + k * B, B * .4, brassF, 'square', .02, 2, .004);   // contratempo da marchinha
    for (let k = 0; k < 8; k++) hit(t + k * B / 2, 2600, .9, .1, k % 4 === 2 ? .22 : .08);                // caixa
    if (bar % 4 === 3) for (let j = 0; j < 6; j++) hit(t + 3 * B + j * B / 6, 2600, .9, .06, .12);
  });
  hit(t0, 5000, .5, 2.2, .3, 'highpass'); hit(t0 + bt * B - .1, 5000, .5, 2.2, .3, 'highpass');

function drawStadiumFacade(I) {                     // fachada de São Januário (estilização)
  const x0 = GATE_X - 160 - I.camX, top = 190, W2 = 760;
  ctx.fillStyle = '#ece6d8'; ctx.fillRect(x0, top, W2, 335);
  ctx.fillStyle = '#d9d0bd'; ctx.fillRect(x0, top + 300, W2, 35);

  ctx.fillStyle = '#d9d0bd'; ctx.beginPath(); ctx.moveTo(x0 + 110, top - 90); ctx.lineTo(x0 + 180, top - 140); ctx.lineTo(x0 + 250, top - 90); ctx.fill();
  ctx.fillStyle = '#2d5aa8'; ctx.fillRect(x0, top + 20, W2, 16);                         // faixa de azulejo
  ctx.fillStyle = '#ffffff'; for (let k = 0; k < W2; k += 16) ctx.fillRect(x0 + k + 6, top + 24, 4, 8);

  for (let i = 0; i < 12; i++) {                                                            // bandeiras no muro
    const fx = x0 + 20 + i * 62, fy = top + 92, wv = Math.sin(clock * 5 + i) * 3;
    ctx.fillStyle = i % 2 ? '#111' : '#f4f4f4'; ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(fx + 40, fy + wv); ctx.lineTo(fx + 40, fy + 30 + wv); ctx.lineTo(fx, fy + 30); ctx.fill();

function drawIntro() {
  const I = INTRO, t = clock;
  let g = ctx.createLinearGradient(0, ymin, 0, 540); g.addColorStop(0, '#060b1c'); g.addColorStop(1, '#1a2340');
  ctx.fillStyle = g; ctx.fillRect(xmin - 20, ymin - 20, xmax - xmin + 40, 560 - ymin + 20);
  drawSkyFX(t);
  for (const h of I.houses) {                                                              // casas (parallax)
    const x = h.x - I.camX * .6 + 120; if (x > xmax + 20 || x + h.w < xmin - 20) continue;
    ctx.fillStyle = h.c; ctx.fillRect(x, 525 - h.h, h.w, h.h);
    for (let r = 0; r < Math.floor(h.h / 34); r++) for (let c = 0; c < Math.floor(h.w / 30); c++) {
      ctx.fillStyle = ((r * 7 + c * 3 + (h.lit * 10 | 0)) % 4) ? 'rgba(255,214,120,.75)' : 'rgba(20,24,36,.9)';
      ctx.fillRect(x + 10 + c * 30, 525 - h.h + 12 + r * 34, 14, 18);
    }
  }
  drawStadiumFacade(I);
  ctx.fillStyle = '#8a8f98'; ctx.fillRect(xmin - 20, 520, xmax - xmin + 40, 30);           // calçada
  ctx.fillStyle = '#2c2f36'; ctx.fillRect(xmin - 20, 550, xmax - xmin + 40, VH - 550 + 40); // rua
  ctx.fillStyle = '#d8d8d8'; for (let k = -200; k < 2200; k += 90) { const x = k - I.camX; if (x > xmin - 80 && x < xmax + 20) ctx.fillRect(x, 690, 46, 6); }
  for (const f of I.fans) if (!f.front) introFan(f, I);
  for (const m of I.smoke) { ctx.fillStyle = 'rgba(205,195,200,' + m.a.toFixed(3) + ')'; ctx.beginPath(); ctx.arc(m.x - I.camX, m.y, m.r, 0, 7); ctx.fill(); }
  drawBus(I);
  I.fans.filter(f => f.front).sort((a, b) => a.y - b.y).forEach(f => introFan(f, I));
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const q of I.pops) {                                                                // estouros das bombinhas
    const x = q.x - I.camX, a = 1 - q.t / .5, R = 10 + q.t * 120;
    const pg = ctx.createRadialGradient(x, q.y, 1, x, q.y, R); pg.addColorStop(0, 'rgba(255,250,220,' + a + ')'); pg.addColorStop(.4, 'rgba(255,170,60,' + a * .6 + ')'); pg.addColorStop(1, 'rgba(255,120,40,0)');
    ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(x, q.y, R, 0, 7); ctx.fill();

    const H2 = VH - ymin + 80, top = VH + 20 - I.flag * H2, L = xmin - 30, R2 = xmax + 30;
    ctx.save(); ctx.beginPath(); ctx.moveTo(L, VH + 60);
    for (let k = 0; k <= 24; k++) { const xx = lerp(L, R2, k / 24); ctx.lineTo(xx, top + Math.sin(clock * 3 + k * .7) * 12); }
    ctx.lineTo(R2, VH + 60); ctx.closePath(); ctx.fillStyle = '#0f0f0f'; ctx.fill(); ctx.clip();
    ctx.strokeStyle = '#f2f2f2'; ctx.lineWidth = (R2 - L) * .3; ctx.beginPath(); ctx.moveTo(R2, top - 40); ctx.lineTo(L, top + H2 + 40); ctx.stroke();

let grainPat = null;

  ctx.save(); ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    for (let i = 0; i < id.data.length; i += 4) { const v = Math.random() * 255 | 0; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.fillStyle = '#08122b'; ctx.fillRect(0, 0, W, H);
  const FY = 330;
  ctx.setTransform(DPR * S * zoom, 0, 0, DPR * S * zoom, DPR * (OX + S * CX * (1 - zoom) + shx), DPR * (OY + S * FY * (1 - zoom) + shy));
  if (INTRO) { drawIntro(); return; }
  drawStands(clock); drawSkyFX(clock); drawBoards(); drawGrass(); drawLines(); drawCrew(); drawBallShadow();
  if (view === 'inside') {
    drawKicker();
    if (ball.visible && ball.Z > .25) drawBall();
    drawKeeper();
    if (ball.visible && ball.Z >= 0 && ball.Z <= .25) drawBall();
    drawGoalFront();
    if (ball.visible && ball.Z < 0) drawBall();
    drawGoalBack(); drawNetInside();
  } else {
    drawGoalBack();
    if (ball.visible && ball.Z < 0) drawBall();
    drawKeeper();
    drawGoalFront();
    const wz = wall ? wall.cz : -99;
    if (ball.visible && ball.Z >= 0 && ball.Z < wz) drawBall();

    if (ball.visible && ball.Z >= Math.max(0, wz)) drawBall();

    ctx.fillStyle = Math.sin(clock * 8) > 0 ? '#ff2a3a' : '#7a0010'; ctx.beginPath(); ctx.arc(28, 127, 6, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '800 20px "Barlow Condensed","Arial Narrow",Impact,sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText('REPLAY', 40, 128);

function drawBroadcast() {

  }
}

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (!paused) update(dt); else if (AUD.ctx) updateChant(); draw(); requestAnimationFrame(frame);
}
window.addEventListener('resize', resize);
resize(); if (PREF.intro) showStart(); else showMenu(); updateScoreboard();
requestAnimationFrame(frame);
})();
